name: broken-link-checker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 5'

permissions:
  contents: read

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Broken Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # root-dir resolves root-relative links (/assets/...) against the
          # docs source; theme templates and the page template are rendered
          # into full pages at build time so their /-links can't resolve here
          # UISP help pages serve 403 responses to automated link checkers.
          # The private Forge is not reliably reachable from public runners.
          args: >-
            --verbose --no-progress
            --root-dir "$GITHUB_WORKSPACE/docs"
            --exclude-path theme
            --exclude-path template.md
            --exclude '^https://help\.uisp\.com/'
            --exclude '^https://git\.3os\.re/'
            './**/*.md' './**/*.html' './**/*.rst'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
